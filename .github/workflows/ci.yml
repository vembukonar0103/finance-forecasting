name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Syntax & Code Linting
  # ----------------------------------------------------------------------------
  lint:
    name: Code Linting & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Python Syntax Validation
        run: |
          python -m compileall -q api features models utils scripts config tests

      - name: Run Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 api features utils --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other warnings as non-fatal
          flake8 api features utils --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  # ----------------------------------------------------------------------------
  # Job 2: Unit & Integration Test Suite
  # ----------------------------------------------------------------------------
  test:
    name: Pytest Suite & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache TA-Lib C Library
        id: cache-talib
        uses: actions/cache@v4
        with:
          path: /usr/lib/libta_lib*
          key: ${{ runner.os }}-talib-0.4.0

      - name: Install TA-Lib C Library
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget https://sourceforge.net/projects/ta-lib/files/ta-lib/0.4.0/ta-lib-0.4.0-src.tar.gz/download -O ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make -j$(nproc)
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=utils --cov=features --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Job 3: Docker Container Build Verification
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [ lint ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: finance-forecasting:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
